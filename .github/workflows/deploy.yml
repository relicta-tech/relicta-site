name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-marketing:
    name: Deploy Marketing Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Deploy only if the output is actually correct — a green `astro build` is
      # not sufficient evidence. See scripts/verify-build.mjs.
      - name: Verify build output
        run: node scripts/verify-build.mjs src dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=relicta-site

  deploy-docs:
    name: Deploy Documentation Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Was `rm -rf node_modules package-lock.json && npm install`, which
      # discarded the committed lockfile and resolved fresh versions at deploy
      # time — so the deployed docs were not reproducible and Dependabot's lock
      # updates had no effect here. The lockfile was out of sync with
      # package.json (missing esbuild's optional platform binaries), which is
      # what `npm ci` was failing on; regenerating it fixed the cause.
      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

      - name: Verify build output
        run: node scripts/verify-build.mjs docs/src docs/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=relicta-docs
