name: Build

# deploy.yml runs only on push to main, so before this workflow the sole
# pre-merge signal was Cloudflare's own preview build. That left two gaps: a
# pull request could go green with no Actions build at all, and a merge went
# straight to a production deploy with the first real build happening after the
# code had already landed.
#
# This builds both sites on every pull request and verifies the output, so a
# broken build is caught before merge rather than during deployment.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-marketing:
    name: Build Marketing Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `astro build` exiting 0 does not mean the output is right: an Astro
      # major once built green while turning every mermaid diagram into raw
      # graph syntax. See scripts/verify-build.mjs.
      - name: Verify build output
        run: node scripts/verify-build.mjs src dist

  build-docs:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

      - name: Verify build output
        run: node scripts/verify-build.mjs docs/src docs/dist
